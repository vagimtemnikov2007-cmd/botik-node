services:
  bot:
    build: .
    env_file: .env
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:8000:8000"
    mem_limit: 1g
    cpus: 2
    tmpfs:
      - /tmp:size=1g,mode=1777
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
